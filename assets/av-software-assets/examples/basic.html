<!doctype html><html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../favicons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../tokens/brand.css"><title>AV Assets Example</title><style>body{margin:0;background:var(--av-bg);color:var(--av-text);font:16px var(--av-font-body);padding:5vw}header{display:flex;align-items:center;gap:2rem;flex-wrap:wrap}header img{width:min(560px,100%)}.icons{display:flex;gap:20px;margin-top:35px}.icons img{width:28px;height:28px;filter:invert(1)}button{background:var(--av-accent);color:var(--av-accent-text);border:0;border-radius:8px;padding:12px 20px;font-weight:bold}</style></head><body><header><img src="../brand/svg/av-horizontal-dark-tagline.svg" alt="AV Software & Operations"><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.querySelector('header img').src='../brand/svg/av-horizontal-'+document.documentElement.dataset.theme+'-tagline.svg'">Toggle theme</button></header><h1>AV asset integration preview</h1><p>Use SVG files in normal &lt;img&gt; tags. For currentColor, inline the icon SVG markup or use a CSS mask.</p><div class="icons"><img src="../icons/auth/lock.svg" alt="Lock"><img src="../icons/navigation/home.svg" alt="Home"><img src="../icons/dashboard/chart-bar.svg" alt="Analytics"></div><p>These icons are black by default in an IMG tag. Use inline SVG or CSS masking for correct theme-aware coloring.</p></body></html>
